version: "3.9"
name: stack
x-common: &common
  restart: unless-stopped
  logging:
    driver: json-file
    options:
      max-size: 10m
      max-file: "3"
services:
  proxy:
    <<: *common
    image: traefik:v3.1
    command:
      - --providers.docker=true
      - --entrypoints.web.address=:80
    ports:
      - "80:80"
      - "127.0.0.1:8080:8080"
      - target: 443
        published: 443
        protocol: tcp
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
    labels:
      traefik.enable: "true"
  app:
    <<: *common
    build:
      context: ./app
      dockerfile: Dockerfile.prod
      args:
        NODE_ENV: production
    environment:
      - NODE_ENV=production
      - SECRET_TOKEN
    env_file: .env
    depends_on:
      db:
        condition: service_healthy
        restart: true
    networks:
      - backend
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3000/health"]
      interval: 30s
    deploy:
      replicas: 2
      resources:
        limits:
          cpus: "0.50"
          memory: 512M
        reservations:
          memory: 128M
  db:
    image: postgres:16
    volumes:
      - pgdata:/var/lib/postgresql/data
      - type: bind
        source: ./init
        target: /docker-entrypoint-initdb.d
    healthcheck:
      test: ["CMD-SHELL", "pg_isready"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      backend:
        aliases: [database]
volumes:
  pgdata:
  external-vol:
    external: true
networks:
  backend:
    driver: bridge
secrets:
  token:
    file: ./token.txt
